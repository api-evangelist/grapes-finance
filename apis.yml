aid: grapes-finance
name: Grapes Finance
description: >-
  Grapes is an all-in-one embedded stablecoin onramp and offramp solution that simplifies and streamlines financial
  transactions. The API enables businesses and developers to integrate fiat-to-stablecoin and stablecoin-to-fiat
  transactions into their applications, services, and platforms, including buying and selling stablecoins such as QCAD
  and USDC with CAD and USD across Ethereum, Algorand, and Stellar networks.
